<!doctype html><meta charset="utf-8"><title>pass</title><body>pass
<script>
// GPT 이미지 작업용: window.name 으로 chatgpt 탭과 데이터 주고받기
// ?send=파일1,파일2 → 이미지들을 dataURL 로 window.name 에 담아 chatgpt 로 이동
// ?recv=1 → window.name 의 {name,data} 목록을 /save 로 저장 후 chatgpt 로 돌아감
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get('send')) {
    const out = [];
    for (const n of q.get('send').split(',')) {
      const b = await (await fetch('/.claude/ref/' + n)).blob();
      out.push({ name: n, data: await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); }) });
    }
    window.name = 'WISA:' + JSON.stringify(out);
    location.href = q.get('back') || 'https://chatgpt.com/';
  } else if (q.get('recv')) {
    let msg = 'nothing';
    if (window.name.startsWith('WISA:')) {
      const arr = JSON.parse(window.name.slice(5)); const res = [];
      for (const it of arr) { const b = await (await fetch(it.data)).blob(); const r = await fetch('/save?name=' + encodeURIComponent(it.name), { method: 'POST', body: b }); res.push(await r.text()); }
      msg = res.join(' | '); window.name = '';
    }
    document.body.textContent = 'saved: ' + msg;
    if (q.get('back')) setTimeout(() => location.href = q.get('back'), 300);
  }
})();
</script>
