<!doctype html><meta charset="utf-8"><title>relay</title><body>relay
<script>
// GPT 이미지 작업용 중계 페이지: chatgpt 탭 ↔ 로컬 서버 (CSP 로 직접 fetch 가 막혀 postMessage 로 주고받음)
addEventListener('message', async e => {
  const d = e.data || {};
  try {
    if (d.type === 'get') {
      const b = await (await fetch(d.url)).blob();
      e.source.postMessage({ type: 'got', id: d.id, blob: b }, '*');
    } else if (d.type === 'save') {
      const r = await fetch('/save?name=' + encodeURIComponent(d.name), { method: 'POST', body: d.blob });
      e.source.postMessage({ type: 'saved', id: d.id, text: await r.text() }, '*');
    }
  } catch (err) { e.source.postMessage({ type: 'err', id: d.id, text: String(err) }, '*'); }
});
if (opener) opener.postMessage({ type: 'ready' }, '*');
document.body.append(' ready');
</script>
