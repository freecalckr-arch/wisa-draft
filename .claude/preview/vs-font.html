<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VS 글꼴 비교</title>
<link rel="stylesheet" href="../../assets/common/wisa.css?v=725">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,800&family=Poppins:ital,wght@1,700&family=Inter:ital,opsz,wght@1,14..32,900&family=Barlow+Condensed:ital,wght@1,700&family=Playfair+Display:ital,wght@1,800&display=swap&text=VS">
<style>
  body { margin: 0; background: var(--gray-50); font-family: 'Pretendard Variable', Pretendard, sans-serif; color: var(--gray-900); }
  .vf-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  .vf-wrap h1 { margin: 0; font-size: 28px; line-height: 38px; }
  .vf-lede { margin: 8px 0 24px; color: var(--gray-600); font-size: 15px; line-height: 24px; }
  .vf-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .vf-grid { grid-template-columns: minmax(0, 1fr); } }
  .vf-card { padding: 20px; border-radius: 16px; background: var(--white); box-shadow: inset 0 0 0 1px var(--gray-200); }
  .vf-card.cur { box-shadow: inset 0 0 0 2px var(--primary-600); }
  .vf-card h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 17px; line-height: 24px; }
  .vf-card h2 b { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--gray-900); color: var(--white); font-size: 13px; }
  .vf-card p { margin: 4px 0 16px; min-height: 40px; color: var(--gray-600); font-size: 13px; line-height: 20px; word-break: keep-all; }
  /* 무대: 흰 카드(Cloud) | 인디고 옅은 카드(Enterprise) + 사이 VS 원 (실제 규격 56 · 흰 원 · Gray 200 테두리) */
  .vf-st { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 140px; padding: 12px; border-radius: 12px; background: var(--gray-50); }
  .vf-st i { border-radius: 12px; background: var(--white); box-shadow: inset 0 0 0 1px var(--gray-200); }
  .vf-st i + i { background: linear-gradient(var(--indigo-25, #f5f8ff), var(--white)); }
  .vf-vs { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: var(--white); box-shadow: inset 0 0 0 1px var(--gray-200), 0 4px 12px rgba(16, 24, 40, .06); display: grid; place-items: center; color: var(--gray-900); font-size: 20px; line-height: 1; }
</style>
</head>
<body>
<div class="vf-wrap">
  <h1>VS 글꼴 비교</h1>
  <p class="vf-lede">솔루션 비교 두 방식 카드 사이 VS · 흰 원 56 · 글자 Gray 900 · 기울임. 글꼴만 다름 (영문 2글자만 받아 오므로 용량 부담 거의 없음).</p>
  <div class="vf-grid" id="g"></div>
</div>
<script>
  const F = [
    ['Pretendard (지금)', "'Pretendard Variable', Pretendard, sans-serif", 800, '페이지 본문과 같은 글꼴을 기울인 것. 가장 무난하지만 강조는 약함.', 1],
    ['Montserrat', "'Montserrat', sans-serif", 800, '넓고 둥근 기하학 글꼴. 스포츠 대결 느낌이 나면서 깔끔함.'],
    ['Poppins', "'Poppins', sans-serif", 700, '둥글고 부드러운 글꼴. 친근하고 가벼운 느낌.'],
    ['Inter Black', "'Inter', sans-serif", 900, '아주 굵은 기본형 글꼴. 단단하고 IT 서비스 느낌.'],
    ['Barlow Condensed', "'Barlow Condensed', sans-serif", 700, '좁고 키 큰 글꼴. 속도감 · 대결 느낌이 가장 강함.', 0, 24],
    ['Playfair Display', "'Playfair Display', serif", 800, '세리프(삐침) 글꼴. 고급스럽고 매거진 느낌.', 0, 22],
  ];
  document.getElementById('g').innerHTML = F.map(([n, f, w, d, cur, fs], i) => `<div class="vf-card${cur ? ' cur' : ''}"><h2><b>${i + 1}</b>${n}</h2><p>${d}</p><div class="vf-st"><i></i><i></i><span class="vf-vs" style="font-family:${f.replace(/"/g, '&quot;')};font-weight:${w};font-style:italic;${fs ? 'font-size:' + fs + 'px' : ''}">VS</span></div></div>`).join('');
</script>
</body>
</html>
