<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>화살표 모션 비교</title>
<link rel="stylesheet" href="../../assets/common/wisa.css?v=725">
<style>
  body { margin: 0; background: var(--gray-50); font-family: 'Pretendard Variable', Pretendard, sans-serif; color: var(--gray-900); }
  .am-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 24px 80px; }
  .am-wrap h1 { margin: 0; font-size: 28px; line-height: 38px; }
  .am-lede { margin: 8px 0 24px; color: var(--gray-600); font-size: 15px; line-height: 24px; }
  .am-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 760px) { .am-grid { grid-template-columns: minmax(0, 1fr); } }
  .am-card { padding: 24px; border-radius: 16px; background: var(--white); box-shadow: inset 0 0 0 1px var(--gray-200); }
  .am-card h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 20px; line-height: 28px; }
  .am-card h2 b { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--gray-900); color: var(--white); font-size: 14px; }
  .am-card p { margin: 6px 0 20px; color: var(--gray-600); font-size: 14px; line-height: 22px; word-break: keep-all; }
  .am-row { display: grid; grid-template-columns: minmax(0, 1fr) 140px; gap: 16px; }
  .am-row small { display: block; margin-bottom: 6px; font-size: 12px; font-weight: 600; color: var(--gray-500); }
  /* 무대: 기존(회색) → 개선(흰 + 블루 테두리) + 가운데 화살표 */
  .am-stage { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; height: 140px; padding: 12px; border-radius: 12px; background: var(--gray-100); }
  .am-stage.mo { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: 220px; }
  .am-box { border-radius: 10px; background: var(--gray-50); box-shadow: inset 0 0 0 1px var(--gray-300); }
  .am-box + .am-box { background: var(--white); box-shadow: inset 0 0 0 1.5px var(--primary-400), 0 6px 16px rgba(16,24,40,.08); }
  /* 화살표 원 = 실제 시안 규격 (검은 원 36 · 흰 테두리 4) */
  .am-ar { position: absolute; left: 50%; top: 50%; z-index: 2; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; background: var(--black); color: var(--white); box-shadow: 0 0 0 4px var(--white); overflow: hidden; }
  .am-stage.mo .am-ar { transform: rotate(90deg); }
  .am-ar svg { position: absolute; left: 9px; top: 9px; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  /* 1 꼬리 화살표(→) 통과: 원 밖으로 빠졌다가 반대쪽에서 다시 들어와 멈춤 */
  .v1 svg { animation: v1 2s cubic-bezier(.65, 0, .35, 1) infinite; }
  @keyframes v1 { 0%, 55% { transform: translateX(0); } 77% { transform: translateX(30px); } 77.01% { transform: translateX(-30px); } 100% { transform: translateX(0); } }
  /* 2 꺾쇠 하나(›) 넛지: 앞으로 툭툭 두 번 → 쉼 */
  .v2 svg { animation: v2 1.8s ease-in-out infinite; }
  @keyframes v2 { 0%, 50%, 100% { transform: translateX(0); } 12%, 32% { transform: translateX(5px); } 22%, 42% { transform: translateX(0); } }
  /* 3 꺾쇠 세 개(›››) 물결: 위치 고정, 빛이 앞쪽으로 흘러감 */
  .v3 svg { left: 6px; width: 24px; }
  .v3 svg path { opacity: .25; animation: v3 1.2s linear infinite; }
  .v3 svg path:nth-child(2) { animation-delay: .2s; } .v3 svg path:nth-child(3) { animation-delay: .4s; }
  @keyframes v3 { 0%, 60%, 100% { opacity: .25; } 25% { opacity: 1; } }
  /* 4 그려지는 화살표: 꼬리가 앞으로 그어지고 머리가 붙은 뒤 앞으로 사라짐 */
  .v4 svg .t { stroke-dasharray: 14; animation: v4t 2s ease-in-out infinite; }
  .v4 svg .h { stroke-dasharray: 14; animation: v4h 2s ease-in-out infinite; }
  @keyframes v4t { 0% { stroke-dashoffset: 14; opacity: 1; } 35%, 70% { stroke-dashoffset: 0; opacity: 1; } 90%, 100% { stroke-dashoffset: -14; opacity: 0; } }
  @keyframes v4h { 0%, 25% { stroke-dashoffset: 14; opacity: 1; } 45%, 70% { stroke-dashoffset: 0; opacity: 1; } 90%, 100% { stroke-dashoffset: 0; opacity: 0; } }
</style>
</head>
<body>
<div class="am-wrap">
  <h1>문제 영역 화살표 모션 비교</h1>
  <p class="am-lede">기존(회색) → 개선(흰) 사이 화살표 · 검은 원 36 · 흰 테두리 4는 그대로, 원 안 화살표 모양 · 움직임만 다름. 카드마다 왼쪽 PC(옆으로) · 오른쪽 모바일(아래로).</p>
  <div class="am-grid" id="g"></div>
</div>
<script>
  const V = [
    ['v1', '꼬리 화살표 · 통과', '→ 화살표가 원 밖으로 빠져나갔다가 반대쪽에서 다시 들어와 멈춤. "다음으로 넘어감" 느낌이 가장 강함.', '<path d="M5 12h14M13 6l6 6-6 6"/>'],
    ['v2', '꺾쇠 하나 · 툭툭', '› 꺾쇠가 앞으로 툭툭 두 번 밀고 쉼. 가장 가볍고 단정함.', '<path d="M9 5l7 7-7 7"/>'],
    ['v3', '꺾쇠 세 개 · 물결', '››› 꺾쇠 3개가 앞쪽으로 차례로 켜짐. 위치는 고정, 빛이 흘러가며 방향을 보여 줌.', '<path d="M2 6l6 6-6 6"/><path d="M9 6l6 6-6 6"/><path d="M16 6l6 6-6 6"/>'],
    ['v4', '그려지는 화살표', '→ 꼬리가 앞으로 그어지고 머리가 붙은 뒤 사라짐. 바뀌는 과정을 그리는 느낌.', '<path class="t" d="M5 12h14"/><path class="h" d="M13 6l6 6-6 6"/>'],
  ];
  const ar = (c, p) => `<span class="am-ar ${c}"><svg viewBox="0 0 24 24">${p}</svg></span>`;
  document.getElementById('g').innerHTML = V.map(([c, n, d, p], i) => `<div class="am-card"><h2><b>${i + 1}</b>${n}</h2><p>${d}</p><div class="am-row"><div><small>PC</small><div class="am-stage"><i class="am-box"></i><i class="am-box"></i>${ar(c, p)}</div></div><div><small>모바일</small><div class="am-stage mo"><i class="am-box"></i><i class="am-box"></i>${ar(c, p)}</div></div></div></div>`).join('');
</script>
</body>
</html>
