<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>모바일 타이틀 · 크기 보기</title>
<link rel="stylesheet" href="../../../assets/common/wisa.css?v=498">
<style>
  html, body { margin: 0; background: var(--white); }
  body { display: flex; flex-wrap: nowrap; align-items: flex-start; justify-content: center; gap: 16px 24px; padding: 24px 16px; box-sizing: border-box; }
  figure { margin: 0; flex: 0 1 240px; min-width: 0; }
  figcaption { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--gray-500); }
  figcaption b { color: var(--primary-700); }
  .ph { padding: 24px 20px; border: 1px solid var(--gray-200); border-radius: 16px; background: var(--white); }
  .ph h2 { margin: 0; font-weight: 700; line-height: 1.4; letter-spacing: -0.02em; color: var(--gray-900); word-break: keep-all; }
  .ph p { margin: 12px 0 0; font-size: 15px; line-height: 1.6; color: var(--gray-600); word-break: keep-all; }
  .old h2 { font-size: 28px; }
  .new h2 { font-size: 26px; }
  @media (max-width: 520px) { body { gap: 12px; padding: 20px 12px; } .ph { padding: 16px 12px; } .ph p { display: none; } }
</style>
</head>
<body>
<!-- 규칙 사이트 기존 수정 목록 · 모바일 타이틀 데모: 모바일(≤767) 영역 타이틀 28 → 26px 을 글자로 바로 비교 (캡처 대신 HTML) -->
<figure class="old">
  <figcaption>기존 · 28px</figcaption>
  <div class="ph"><h2>빠르게 시작하는 쇼핑몰, 부스터 Cloud</h2><p>설치 없이 바로 열고 필요한 기능만 더합니다.</p></div>
</figure>
<figure class="new">
  <figcaption><b>신규</b> · 26px</figcaption>
  <div class="ph"><h2>빠르게 시작하는 쇼핑몰, 부스터 Cloud</h2><p>설치 없이 바로 열고 필요한 기능만 더합니다.</p></div>
</figure>
</body>
</html>
